# AWS SAM CLI configuration file for Alexa+ Backend
# More information: https://docs.aws.amazon.com/serverless-application-model/latest/developerguide/serverless-sam-cli-config.html

version = 0.1

[default]
[default.global.parameters]
stack_name = "alexa-plus-backend"

[default.build.parameters]
cached = true
parallel = true

[default.validate.parameters]
lint = true

[default.deploy.parameters]
capabilities = "CAPABILITY_IAM"
confirm_changeset = true
resolve_s3 = true
s3_prefix = "alexa-plus-backend"
region = "us-east-1"
stack_name = "alexa-plus-backend"
parameter_overrides = [
    "Stage=\"prod\"",
    "LogLevel=\"INFO\"",
    "AlexaSkillId=\"amzn1.ask.skill.placeholder-alexa-plus-skill-id\"",
    "DatabaseUrl=\"sqlite:////tmp/alexa_mcp.db\"",
    "GeminiApiKey=\"\""
]
image_repositories = []

[default.package.parameters]
resolve_s3 = true

[default.sync.parameters]
watch = true

[default.local_start_api.parameters]
port = 5000
host = "127.0.0.1"

[default.local_start_lambda.parameters]
port = 3001
host = "127.0.0.1"
